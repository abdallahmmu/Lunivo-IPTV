<div class="flex flex-col gap-4">
  <h1 class="text-xl font-semibold text-brand-cream">Series</h1>

  <app-category-tabs [categories]="categories()" [activeId]="selectedCategoryId()" (select)="selectCategory($event)" />

  <div class="sm:max-w-xs">
    <app-search-bar placeholder="Search series…" [value]="searchQuery()" (valueChange)="onSearch($event)" />
  </div>

  @if (loading() && !visibleItems().length) {
    <app-skeleton-loader variant="poster-grid" [count]="18" />
  } @else if (error(); as err) {
    <app-error-state [error]="err" (retry)="retry()" />
  } @else if (!visibleItems().length) {
    <app-empty-state icon="📺" title="No series found" subtitle="Try a different category or search term." />
  } @else {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (series of visibleItems(); track series.series_id) {
        <app-poster-card
          [title]="series.name"
          [image]="series.cover"
          [rating]="series.rating"
          [isFavorite]="isFavorite(series)"
          (activate)="open(series)"
          (favoriteToggle)="toggleFavorite(series)"
        />
      }
    </div>

    @if (hasMore()) {
      <div appVisibleOnScroll (visible)="loadMore()" class="flex justify-center py-6">
        <div class="h-6 w-6 animate-spin rounded-full border-2 border-brand-deep-700 border-t-brand-deep-300"></div>
      </div>
    }
  }
</div>
