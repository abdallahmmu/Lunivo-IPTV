<div class="flex flex-col gap-4">
  <h1 class="text-xl font-semibold text-brand-cyan">Favorites</h1>

  <div class="flex gap-1.5 text-sm">
    @for (t of tabs; track t.key) {
      <button
        type="button"
        (click)="tab.set(t.key)"
        class="rounded-full px-4 py-1.5 font-medium transition"
        [class]="tab() === t.key ? 'bg-brand-secondary text-brand-primary' : 'bg-brand-violet/60 text-brand-cyan hover:bg-brand-violet'"
      >
        {{ t.label }}
      </button>
    }
  </div>

  @if (!itemsFor(tab()).length) {
    <app-empty-state icon="⭐" title="No favorites yet" subtitle="Tap the heart icon on any channel, movie, or series to save it here." />
  } @else {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (item of itemsFor(tab()); track item.kind + item.id) {
        <app-poster-card [title]="item.name" [image]="item.image" [isFavorite]="true" (activate)="open(item)" (favoriteToggle)="remove(item.kind, item.id)" />
      }
    </div>
  }
</div>
